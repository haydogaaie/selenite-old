<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/all.js"></script>

    <!-- Inject coins BEFORE game loads -->
    <script>
        // Try multiple possible keys the game might use
        localStorage.setItem("retro_bowl_coins", "1000");
        localStorage.setItem("coins", "1000");
        localStorage.setItem("money", "1000");
    </script>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />

    <meta http-equiv="pragma" content="no-cache" />

    <title>Retro Bowl College</title>

    <style>
        body {
            background: #000;
            color: #cccccc;
            margin: 0;
            padding: 0;
            border: 0;
        }

        canvas {
            image-rendering: pixelated;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            touch-action: none;
            margin: 0;
            padding: 0;
            border: 0;
        }

        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" style="display:none;" />

        <canvas id="canvas" width="853" height="480"
            style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <script type="text/javascript" src="html5game/RetroBowl.js"></script>

    <!-- Force coins again AFTER load -->
    <script>
        window.addEventListener("load", function () {
            setTimeout(() => {
                try {
                    localStorage.setItem("retro_bowl_coins", "1000");
                    localStorage.setItem("coins", "1000");
                    localStorage.setItem("money", "1000");
                } catch (e) {}
            }, 2000);
        });
    </script>

</body>
</html>
